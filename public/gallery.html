<!DOCTYPE html>
<html>
<head>
    <title>Flavor House - Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            background: #fffaf5;
        }

        header {
            background: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 10px #ddd;
        }

        .logo {
            color: #ff6600;
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            text-decoration: none;
            margin-left: 20px;
            color: #333;
            font-weight: bold;
        }

        nav a:hover {
            color: #ff6600;
        }

        .title {
            text-align: center;
            padding: 60px 20px 30px;
        }

        .title h1 {
            font-size: 40px;
        }

        .title h1 span {
            color: #ff6600;
        }

        .title p {
            margin-top: 15px;
            color: #666;
        }

        .gallery {
            padding: 30px 8% 80px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .gallery-item {
            overflow: hidden;
            border-radius: 18px;
            background: white;
            box-shadow: 0 5px 15px #ddd;
        }

        .gallery-item img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
            transition: 0.4s;
        }

        .gallery-item img:hover {
            transform: scale(1.08);
        }

        .gallery-item h3 {
            text-align: center;
            padding: 20px;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media(max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 600px) {
            header {
                flex-direction: column;
                gap: 20px;
            }

            nav a {
                margin: 5px;
                font-size: 14px;
            }

            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Flavor House</div>

    <nav>
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/gallery">Gallery</a>
        <a href="/contact">Contact</a>
    </nav>
</header>

<div class="title">

    <h1>Our Food <span>Gallery</span></h1>

    <p>Take a look at some of our delicious meals.</p>

</div>

<div class="gallery">

    <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=800&q=80">
        <h3>Classic Burger</h3>
    </div>

    <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=800&q=80">
        <h3>Italian Pizza</h3>
    </div>

    <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=800&q=80">
        <h3>Grilled Chicken</h3>
    </div>

    <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=800&q=80">
        <h3>Special Pasta</h3>
    </div>

    <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=800&q=80">
        <h3>Crispy Fries</h3>
    </div>

    <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80">
        <h3>Fresh Salad</h3>
    </div>

</div>

<footer>
    <p>&copy; 2026 Flavor House. All Rights Reserved.</p>
</footer>

</body>
</html>
